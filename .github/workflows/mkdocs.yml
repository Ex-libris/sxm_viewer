name: Deploy MkDocs

# The published site is what the README and the Zenodo record link to, so it
# is built from master only. (It used to deploy on a push to any branch, so
# the site showed whichever branch had been pushed last.)
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material pymdown-extensions

      - name: Deploy
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs gh-deploy --force --strict
