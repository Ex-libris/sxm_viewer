name: Tests

# Runs on every push and pull request: lint gate, unit tests, an import of
# every module, and the headless smoke test (UI checks; no data needed).
# Windows only - the application is developed and used on Windows.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest ruff

      - name: Lint (syntax errors, undefined names, unused imports)
        run: ruff check sxm_viewer scripts

      - name: Unit tests
        run: python -m pytest -q sxm_viewer/tests

      - name: Import every module
        run: python scripts/check_imports.py

      - name: Smoke test (UI checks)
        run: python -u scripts/smoke_test.py
